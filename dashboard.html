<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collections Dashboard — PayShield Pro</title>
<meta name="description" content="Track protected funds, overdue invoices and automated payment recovery in PayShield Pro.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        background: '#030712',
        card: '#0b1120',
        border: 'rgba(255,255,255,0.08)',
        primary: '#4f6df5',
        muted: '#8b93a7',
        success: '#34d399',
        warning: '#fbbf24',
        destructive: '#f87171',
      },
      fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
    },
  },
};
</script>
<style>
  body { background: #030712; }
  .grad { background-image: linear-gradient(135deg, #4f6df5, #6a5ae0); }
  .glow { box-shadow: 0 10px 40px -12px rgba(79,109,245,0.55); }
  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:9999px; border-width:1px; padding:4px 10px; font-size:12px; font-weight:500; white-space:nowrap; }
  .pill .dot { width:6px; height:6px; border-radius:9999px; background:currentColor; }
  .pill-ok { color:#34d399; background:rgba(52,211,153,0.10); border-color:rgba(52,211,153,0.20); }
  .pill-nudge { color:#fbbf24; background:rgba(251,191,36,0.10); border-color:rgba(251,191,36,0.20); }
  .pill-warn { color:#fbbf24; background:rgba(251,191,36,0.15); border-color:rgba(251,191,36,0.30); }
  .pill-critical { color:#f87171; background:rgba(248,113,113,0.10); border-color:rgba(248,113,113,0.25); }
  input, select { color-scheme: dark; }
</style>
<style>
.slide-panel{display:none;opacity:0;transform:translateY(16px);transition:opacity .35s ease,transform .35s ease}
.slide-panel.show{opacity:1;transform:none}
</style>
</head>
<body class="font-sans text-slate-100 antialiased">

<!-- Sidebar -->
<aside class="fixed inset-y-0 left-0 z-20 hidden w-64 flex-col border-r border-border bg-[#0a0f1e] md:flex">
  <div class="flex h-16 items-center gap-2.5 px-6">
    <div class="grad glow grid size-8 place-items-center rounded-lg">
      <svg class="size-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
    </div>
    <span class="font-bold tracking-tight">PayShield <span class="text-primary">Pro</span></span>
  </div>
  <nav class="mt-4 flex flex-col gap-1 px-3" id="nav"></nav>
  <div class="m-3 mt-auto rounded-xl border border-border bg-card p-4">
    <p class="text-xs text-muted">Signed in as</p>
    <p class="mt-1 text-sm font-semibold">Yabsira M.</p>
    <p class="text-xs text-primary">Pro plan</p>
  </div>
</aside>

<div class="md:pl-64">
  <!-- Header -->
  <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-border bg-background/80 px-6 backdrop-blur lg:px-10">
    <div class="flex w-72 max-w-full items-center gap-2 rounded-lg border border-border bg-card px-3 py-2 text-sm text-muted">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Search invoices or clients…
    </div>
    <div class="flex items-center gap-3">
      <button aria-label="Notifications" class="grid size-9 place-items-center rounded-lg border border-border bg-card text-muted hover:text-slate-100">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
      <button id="openModal" class="grad glow inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold text-white transition hover:brightness-110">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Secure New Invoice
      </button>
    </div>
  </header>

  <main class="space-y-8 px-6 py-8 lg:px-10">
    <div>
      <h1 class="text-2xl font-bold tracking-tight" id="pageTitle">Collections Dashboard</h1>
      <p class="mt-1 text-sm text-muted" id="pageSub">Monitor protected invoices and automated recovery in real time.</p>
    </div>

    <div id="collectionsView" class="space-y-8">
    <!-- Stats -->
    <section class="grid gap-5 md:grid-cols-3" id="stats"></section>

    <!-- Ledger -->
    <section class="overflow-hidden rounded-2xl border border-border bg-card">
      <div class="flex items-center justify-between border-b border-border px-6 py-4">
        <div>
          <h2 class="font-semibold">Active Invoice Ledger</h2>
          <p class="text-xs text-muted" id="ledgerCount"></p>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-xs uppercase tracking-wider text-muted">
              <th class="px-6 py-3 font-medium">Invoice</th>
              <th class="px-6 py-3 font-medium">Client</th>
              <th class="px-6 py-3 font-medium">Amount</th>
              <th class="px-6 py-3 font-medium">Due date</th>
              <th class="px-6 py-3 font-medium">Recovery stage</th>
              <th class="px-6 py-3 font-medium"></th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
    </section>
    </div>

    <!-- Blacklist Directory -->
    <div id="blacklistView" class="slide-panel space-y-6">
      <form id="bSearchForm" class="flex flex-col gap-3 rounded-2xl border border-border bg-card p-4 sm:flex-row">
        <div class="flex flex-1 items-center gap-3 rounded-xl border border-border bg-[#030712] px-4">
          <svg class="size-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="bSearch" type="text" autocomplete="off" placeholder="Search companies, agencies, or client emails..." class="w-full bg-transparent py-3 text-sm text-slate-100 placeholder:text-slate-500 outline-none" />
        </div>
        <button type="submit" class="glow rounded-xl bg-primary px-6 py-3 text-sm font-semibold text-white transition hover:brightness-110" style="box-shadow:0 0 24px -4px rgba(59,130,246,.75)">Verify Client Status</button>
      </form>
      <div id="bResult"></div>
      <section class="overflow-hidden rounded-2xl border border-border bg-card">
        <div class="border-b border-border px-6 py-4">
          <h2 class="font-semibold">Reported Client Ledger</h2>
          <p class="text-xs text-muted" id="bCount"></p>
        </div>
        <div id="bList"></div>
      </section>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 z-50 hidden place-items-center bg-black/70 p-4 backdrop-blur-sm">
  <div class="glow w-full max-w-md rounded-2xl border border-border bg-card p-6" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-semibold" id="modalTitle">Secure New Invoice</h3>
      <button id="closeModal" aria-label="Close" class="text-muted hover:text-slate-100">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <form id="invoiceForm" class="mt-5 space-y-4">
      <label class="block">
        <span class="text-xs font-medium text-muted">Client Name</span>
        <input id="fClient" required placeholder="Acme Corp" class="mt-1.5 w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary">
      </label>
      <label class="block">
        <span class="text-xs font-medium text-muted">Client Email</span>
        <input id="fEmail" type="email" required placeholder="billing@acme.com" class="mt-1.5 w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary">
      </label>
      <label class="block">
        <span class="text-xs font-medium text-muted">Invoice Amount (USD)</span>
        <input id="fAmount" type="number" min="0.01" step="0.01" required placeholder="2,500.00" class="mt-1.5 w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary">
      </label>
      <label class="block">
        <span class="text-xs font-medium text-muted">Due Date</span>
        <input id="fDue" type="date" required class="mt-1.5 w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary">
      </label>
      <button type="submit" class="grad w-full rounded-lg py-2.5 text-sm font-semibold text-white hover:brightness-110">
        Activate Protection
      </button>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "payshield_invoices_v1";

  var NAV_ITEMS = [
    { label: "Collections Dashboard" },
    { label: "My Invoices" },
    { label: "Client Blacklist Directory" },
    { label: "Payment Settings" }
  ];

  var SEED_INVOICES = [
    { id: "INV-2041", client: "Acme Corp", email: "billing@acme.com", amount: 3200, due: "2026-10-27" },
    { id: "INV-2038", client: "Globex Industries", email: "ap@globex.com", amount: 1500, due: "2026-10-18" },
    { id: "INV-2044", client: "Initech GmbH", email: "finance@initech.de", amount: 4750, due: "2026-11-02" },
    { id: "INV-2036", client: "Umbrella Labs", email: "pay@umbrella.io", amount: 2100, due: "2026-10-22" },
    { id: "INV-2047", client: "Stark Studio", email: "hello@stark.studio", amount: 6900, due: "2026-11-12" }
  ];

  function loadInvoices() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) { /* corrupted storage falls through to seed */ }
    return SEED_INVOICES.slice();
  }

  function saveInvoices(list) {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  var invoices = loadInvoices();
  saveInvoices(invoices); // persist seed on first run so later edits keep working

  function fmtMoney(n) {
    return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtDate(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" });
  }

  function stageFor(dueIso) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var due = new Date(dueIso + "T00:00:00");
    var days = Math.floor((today - due) / 86400000);
    if (days <= 0) return { label: "Not yet due", level: "ok" };
    if (days <= 7) return { label: "Day " + days + " - Friendly Reminder", level: "ok" };
    if (days <= 12) return { label: "Day " + days + " - Firm Nudge", level: "nudge" };
    if (days <= 16) return { label: "Day " + days + " - Escalation", level: "warn" };
    return { label: "Day " + days + " - Final Warning", level: "critical" };
  }

  function nextId() {
    var max = 2035;
    invoices.forEach(function (inv) {
      var n = parseInt(String(inv.id).replace(/\D/g, ""), 10);
      if (!isNaN(n) && n > max) max = n;
    });
    return "INV-" + (max + 1);
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    NAV_ITEMS.forEach(function (item, idx) {
      var btn = document.createElement("button");
      var on = idx === 0;
      btn.className = "flex items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium transition-colors " +
        (on ? "bg-primary/10 text-slate-100" : "text-slate-400 hover:bg-white/5 hover:text-slate-100");
      btn.innerHTML = '<span class="size-2 rounded-full ' + (on ? "bg-primary" : "bg-slate-600") + '"></span>' + item.label;
      btn.addEventListener("click", function () {
        document.getElementById("pageTitle").textContent = item.label;
        renderNavActive(idx);
        showView(item.label);
      });
      nav.appendChild(btn);
    });
  }

  function renderNavActive(activeIdx) {
    var nav = document.getElementById("nav");
    Array.prototype.forEach.call(nav.children, function (btn, idx) {
      var on = idx === activeIdx;
      btn.className = "flex items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium transition-colors " +
        (on ? "bg-primary/10 text-slate-100" : "text-slate-400 hover:bg-white/5 hover:text-slate-100");
      btn.firstChild.className = "size-2 rounded-full " + (on ? "bg-primary" : "bg-slate-600");
    });
  }

  function renderStats() {
    var total = 0, overdue = 0, overdueCount = 0;
    invoices.forEach(function (inv) {
      total += Number(inv.amount) || 0;
      var s = stageFor(inv.due);
      if (s.level === "warn" || s.level === "critical") { overdue += Number(inv.amount) || 0; overdueCount++; }
    });
    var cards = [
      { label: "Total Protected Funds", value: fmtMoney(total), note: invoices.length + " invoices under protection", tone: "text-primary bg-primary/10" },
      { label: "Critically Overdue", value: fmtMoney(overdue), note: overdueCount + " invoice" + (overdueCount === 1 ? "" : "s") + " need attention", tone: "text-destructive bg-destructive/10" },
      { label: "Auto-Recovered This Month", value: "$8,420.00", note: "6 invoices settled", tone: "text-success bg-success/10" }
    ];
    var wrap = document.getElementById("stats");
    wrap.innerHTML = "";
    cards.forEach(function (c) {
      var div = document.createElement("div");
      div.className = "rounded-2xl border border-border bg-card p-6 transition hover:border-primary/30";
      div.innerHTML =
        '<div class="flex items-center justify-between">' +
          '<p class="text-sm text-muted">' + c.label + '</p>' +
          '<div class="grid size-9 place-items-center rounded-lg ' + c.tone + '"><span class="size-2 rounded-full bg-current"></span></div>' +
        '</div>' +
        '<p class="mt-4 text-3xl font-bold tracking-tight tabular-nums">' + c.value + '</p>' +
        '<p class="mt-1 text-xs text-muted">' + c.note + '</p>';
      wrap.appendChild(div);
    });
  }

  function renderLedger() {
    var body = document.getElementById("ledgerBody");
    body.innerHTML = "";
    document.getElementById("ledgerCount").textContent = invoices.length + " invoices under protection";

    if (invoices.length === 0) {
      var emptyRow = document.createElement("tr");
      emptyRow.innerHTML = '<td colspan="6" class="px-6 py-10 text-center text-sm text-muted">No invoices yet. Click "+ Secure New Invoice" to add your first one.</td>';
      body.appendChild(emptyRow);
      return;
    }

    invoices.forEach(function (inv) {
      var s = stageFor(inv.due);
      var tr = document.createElement("tr");
      tr.className = "border-t border-border transition-colors hover:bg-white/5";
      tr.innerHTML =
        '<td class="px-6 py-4 font-mono text-xs text-muted">' + inv.id + '</td>' +
        '<td class="px-6 py-4">' +
          '<div class="flex items-center gap-3">' +
            '<div class="grid size-8 place-items-center rounded-full bg-primary/15 text-xs font-semibold text-primary">' + (inv.client || "?").charAt(0).toUpperCase() + '</div>' +
            '<div><span class="font-medium">' + inv.client + '</span>' +
            (inv.email ? '<p class="text-xs text-muted">' + inv.email + '</p>' : '') + '</div>' +
          '</div>' +
        '</td>' +
        '<td class="px-6 py-4 font-semibold tabular-nums">' + fmtMoney(inv.amount) + '</td>' +
        '<td class="px-6 py-4 text-muted">' + fmtDate(inv.due) + '</td>' +
        '<td class="px-6 py-4"><span class="pill pill-' + s.level + '"><span class="dot"></span>' + s.label + '</span></td>' +
        '<td class="px-6 py-4 text-right">' +
          '<button class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-slate-100 hover:border-primary/40 hover:text-primary">View Reminder Logs</button>' +
        '</td>';
      body.appendChild(tr);
    });
  }

  function renderAll() {
    renderStats();
    renderLedger();
  }

  // Modal wiring
  var modal = document.getElementById("modal");
  var form = document.getElementById("invoiceForm");

  function openModal() {
    modal.classList.remove("hidden");
    modal.classList.add("grid");
    document.getElementById("fClient").focus();
  }
  function closeModal() {
    modal.classList.add("hidden");
    modal.classList.remove("grid");
    form.reset();
  }

  document.getElementById("openModal").addEventListener("click", openModal);
  document.getElementById("closeModal").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.classList.contains("hidden")) closeModal(); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var inv = {
      id: nextId(),
      client: document.getElementById("fClient").value.trim(),
      email: document.getElementById("fEmail").value.trim(),
      amount: parseFloat(document.getElementById("fAmount").value),
      due: document.getElementById("fDue").value
    };
    if (!inv.client || !inv.email || isNaN(inv.amount) || !inv.due) return;
    invoices.push(inv);
    saveInvoices(invoices);
    renderAll();
    closeModal();
  });


  // ===== Blacklist Directory =====
  var BL_KEY = "payshield_blacklist_v1";
  var BL_SEED = [
    { company: "Acme Studio", email: "accounts@acmestudio.co", amount: 4200, status: "Ghosted Payment - 42 Days Overdue", tone: "critical", evidence: "3 invoices issued for brand design work. Client confirmed delivery by email on Sep 12, then stopped replying. 5 reminders and 1 final notice sent with no response." },
    { company: "Alpha Designs", email: "ops@alphadesigns.io", amount: 2750, status: "Refused Contract Terms", tone: "warn", evidence: "Signed the scope of work, then disputed the agreed rate after delivery and offered 40% of the invoice. Signed contract and chat history on file." },
    { company: "Nova Media Agency", email: "finance@novamedia.agency", amount: 6100, status: "Ghosted Payment - 67 Days Overdue", tone: "critical", evidence: "Video editing project delivered in full. Agency's billing email bounces and the project manager blocked the freelancer on all channels." }
  ];
  function loadBL(){ try{ var r=localStorage.getItem(BL_KEY); if(r){ var p=JSON.parse(r); if(Array.isArray(p)) return p; } }catch(e){} return BL_SEED.slice(); }
  var blacklist = loadBL(); localStorage.setItem(BL_KEY, JSON.stringify(blacklist));
  function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
  function renderBL(list){
    var box=document.getElementById("bList"); box.innerHTML="";
    document.getElementById("bCount").textContent = blacklist.length + " reported companies";
    list.forEach(function(c){
      var tag = c.tone==="critical" ? "font-bold text-red-500 bg-red-500/10 border-red-500/25" : "font-semibold text-amber-400 bg-amber-400/10 border-amber-400/25";
      var row=document.createElement("div"); row.className="border-t border-border first:border-t-0 px-6 py-4 transition-colors hover:bg-white/[.03]";
      row.innerHTML='<div class="flex flex-wrap items-center gap-4">'+
        '<div class="flex min-w-[180px] flex-1 items-center gap-3"><div class="grid size-9 place-items-center rounded-full bg-primary/15 text-sm font-semibold text-primary">'+esc(c.company[0])+'</div><div><p class="font-medium">'+esc(c.company)+'</p><p class="text-xs text-muted">'+esc(c.email)+'</p></div></div>'+
        '<div class="w-28"><p class="text-xs text-muted">Disputed</p><p class="font-semibold tabular-nums">$'+Number(c.amount).toLocaleString("en-US")+'</p></div>'+
        '<span class="rounded-full border px-3 py-1 text-xs '+tag+'">'+esc(c.status)+'</span>'+
        '<button class="ev ml-auto text-xs font-medium text-primary hover:underline">View Evidence Summary</button></div>'+
        '<div class="evbox hidden mt-3 rounded-xl border border-border bg-[#030712] p-4 text-sm text-slate-300">'+esc(c.evidence)+'</div>';
      row.querySelector(".ev").addEventListener("click",function(){
        var b=row.querySelector(".evbox"); var h=b.classList.toggle("hidden");
        this.textContent = h ? "View Evidence Summary" : "Hide Evidence Summary";
      });
      box.appendChild(row);
    });
  }
  function searchBL(){
    var q=document.getElementById("bSearch").value.trim().toLowerCase();
    var res=document.getElementById("bResult");
    if(!q){ res.innerHTML=""; renderBL(blacklist); return; }
    var hits=blacklist.filter(function(c){ return c.company.toLowerCase().indexOf(q)>-1 || c.email.toLowerCase().indexOf(q)>-1; });
    renderBL(hits);
    res.innerHTML = hits.length
      ? '<div class="rounded-2xl border border-red-500/30 bg-red-500/10 p-5"><p class="font-semibold text-red-400">⚠️ Dispute Record Found</p><p class="mt-1 text-sm text-slate-300">'+hits.length+' matching report(s) shown below. Review the evidence before accepting work.</p></div>'
      : '<div class="rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-5"><p class="font-semibold text-emerald-400">🔒 Clear Record: No outstanding dispute logs found for this client.</p><p class="mt-1 text-sm text-slate-400">"'+esc(q)+'" has no reports in the PayShield directory.</p></div>';
  }
  document.getElementById("bSearchForm").addEventListener("submit",function(e){ e.preventDefault(); searchBL(); });
  document.getElementById("bSearch").addEventListener("input",function(){ if(!this.value.trim()) searchBL(); });

  function showView(label){
    var bl = label==="Client Blacklist Directory";
    var cv=document.getElementById("collectionsView"), bv=document.getElementById("blacklistView");
    document.getElementById("pageSub").textContent = bl ? "Check a client's payment history before you take on new work." : "Monitor protected invoices and automated recovery in real time.";
    if(bl){ cv.style.display="none"; bv.style.display="block"; requestAnimationFrame(function(){ requestAnimationFrame(function(){ bv.classList.add("show"); }); }); }
    else { bv.classList.remove("show"); bv.style.display="none"; cv.style.display=""; }
  }
  // Initial paint
  renderBL(blacklist);
  renderNav();
  renderAll();
